<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03833d" />
    <title>PlugStudy · Hors connexion</title>
    <style>
      :root { --page: #f3faf5; --text: #000000; --muted: #475569; --accent: #03833d; --on-accent: #ffffff; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: var(--page); color: var(--text); font-family: Inter, system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; }
      img { width: 210px; height: auto; }
      h1 { font-size: 24px; margin: 20px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      button { min-height: 52px; padding: 0 28px; border: 0; border-radius: 14px; background: var(--accent);
        color: var(--on-accent); font-size: 16px; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="PlugStudy" />
      <h1>Tu es hors connexion</h1>
      <p>Vérifie ton réseau puis réessaie. Les pages que tu as déjà ouvertes restent disponibles.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
