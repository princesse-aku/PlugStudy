# Déploiement du backend sur Render (« Blueprint ») : New > Blueprint, puis choisir ce dépôt.
# Les valeurs marquées sync: false sont à saisir dans le tableau de bord Render (elles ne sont jamais dans Git).
services:
  - type: web
    name: plugstudy-api
    runtime: python
    rootDir: backend
    region: frankfurt  # le plus proche du Bénin et du Togo, comme Firestore (eur3)
    # Plan gratuit : le service s'endort après 15 min sans visite (premier appel lent, 30 à 60 s) et une préparation de
    # cours en cours peut être interrompue. Pour une vraie mise en service, passer à « starter » (environ 7 $/mois).
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FIREBASE_PROJECT_ID
        value: plugstudy-2dd5f
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: RODIUMAI_BASE_URL
        sync: false
      - key: RODIUMAI_API_KEY
        sync: false
      - key: RODIUM_MODEL_STRONG
        value: google/gemini-3.8-flash
      - key: RODIUM_MODEL_FAST
        value: google/gemini-3.8-flash
      - key: RODIUM_EMBEDDINGS_ENABLED
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false  # l'adresse Vercel du frontend, par exemple https://plugstudy.vercel.app
